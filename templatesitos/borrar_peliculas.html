<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrar Película</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('/static/images/backgroundsesion.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        .form-container {
            max-width: 550px;
            width: 100%;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }
        
        .header {
            background: linear-gradient(135deg, rgba(220, 53, 69, 0.3), rgba(200, 35, 51, 0.3));
            border-bottom: 1px solid rgba(220, 53, 69, 0.3);
            color: white;
            padding: 35px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.2em;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95em;
            margin-top: 8px;
        }
        
        .form-content {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: white;
            font-weight: 600;
            font-size: 1em;
        }
        
        select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 1em;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        select option {
            background: #1e293b;
            color: white;
        }
        
        select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.2);
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.5);
        }
        
        .back-link {
            display: block;
            text-align: center;
            color: #06b6d4;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            color: #0891b2;
            transform: translateX(-5px);
        }
        
        .warning {
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid rgba(255, 193, 7, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            color: #ffc107;
            text-align: center;
            font-weight: 600;
            font-size: 1.05em;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">
            <h1>🗑️ Borrar Película</h1>
            <p>Elimina permanentemente una película del sistema</p>
        </div>
        
        <div class="form-content">
            <div class="warning">
                ⚠️ Esta acción no se puede deshacer
            </div>
            
            <form method="post" action="/do_borrar_pelicula" onsubmit="return confirm('¿Estás seguro de que quieres borrar esta película?');">
                <div class="form-group">
                    <label for="id">Selecciona la película a borrar</label>
                    <select name="id" id="id" required>
                        <option value="">-- Selecciona una película --</option>
                        {% for pelicula in peliculas %}
                        <option value="{{ pelicula.id }}">{{ pelicula.titulo }} ({{ pelicula.año }})</option>
                        {% endfor %}
                    </select>
                </div>
                
                <button type="submit">🗑️ Borrar Película</button>
            </form>
            
            <a href="/peliculas" class="back-link">← Cancelar y volver</a>
        </div>
    </div>
</body>
</html>
