<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/iconn.png">
    <title>Actualizar Película</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('/static/images/backgroundregistro.jpeg') center center / cover no-repeat fixed;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }
        
        .header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 35px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95em;
            margin-top: 8px;
        }
        
        .form-container {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: white;
            font-weight: 600;
            font-size: 1em;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 1em;
            color: white;
            transition: all 0.3s;
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
        }
        
        .back-link {
            display: block;
            text-align: center;
            color: #06b6d4;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            color: #0891b2;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ Actualizar Película</h1>
            <p>Modifica los datos de la película</p>
        </div>
        
        <div class="form-container">
            <form action="/do_actualizar_pelicula" method="post">
                <input type="hidden" name="id" value="{{ pelicula.id }}">
                
                <div class="form-group">
                    <label for="titulo">🎬 Título</label>
                    <input type="text" id="titulo" name="titulo" value="{{ pelicula.titulo }}" required>
                </div>
                
                <div class="form-group">
                    <label for="genero">🎭 Género</label>
                    <input type="text" id="genero" name="genero" value="{{ pelicula.genero }}" required>
                </div>
                
                <div class="form-group">
                    <label for="año">📅 Año</label>
                    <input type="number" id="año" name="año" value="{{ pelicula.año }}" required min="1900" max="2100">
                </div>
                
                <div class="form-group">
                    <label for="director">🎥 Director</label>
                    <input type="text" id="director" name="director" value="{{ pelicula.director }}" required>
                </div>
                
                <button type="submit">✅ Actualizar Película</button>
            </form>
            
            <a href="/actualizar_peliculas" class="back-link">← Volver a la lista</a>
        </div>
    </div>
</body>
</html>
