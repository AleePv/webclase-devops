<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/iconn.png">
    <title>🎬 Iniciar Sesión - Sistema de Cartelera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('/static/images/backgroundsesion.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }
        
        .login-container {
            max-width: 410px;
            width: 100%;
            background: rgba(34, 40, 49, 0.82);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-radius: 28px;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 48px 0 rgba(0,0,0,0.45), 0 1.5px 0 rgba(255,255,255,0.08) inset;
            padding: 48px 38px 36px 38px;
            animation: fadeInUp 0.6s cubic-bezier(.4,2,.6,1);
            position: relative;
            z-index: 1;
            overflow: visible;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .login-header .emoji-icon {
              font-size: 64px;
              margin-bottom: 18px;
              display: block;
              filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.32));
              animation: bounceIn 1.2s cubic-bezier(.4,2,.6,1);
        }
                @keyframes bounceIn {
                    0% { transform: scale(0.7); opacity: 0; }
                    60% { transform: scale(1.15); opacity: 1; }
                    80% { transform: scale(0.95); }
                    100% { transform: scale(1); }
                }
        
        .login-header h2 {
            font-size: 1.5em;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .login-header h2 {
            font-size: 1.5em;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            font-size: 0.9em;
        }
        
        .form-group input {
              width: 100%;
              padding: 14px 16px 14px 44px;
              border: 1.5px solid rgba(255, 255, 255, 0.18);
              border-radius: 10px;
              font-size: 16px;
              transition: all 0.25s cubic-bezier(.4,2,.6,1);
              background: rgba(255, 255, 255, 0.13);
              color: #fff;
              font-family: inherit;
              box-shadow: 0 2px 8px rgba(0,0,0,0.08) inset;
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .form-group input:focus {
              outline: none;
              border-color: #06b6d4;
              background: rgba(255, 255, 255, 0.18);
              box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.08);
        }
        
        .btn-login {
              width: 100%;
              padding: 15px 0;
              background: linear-gradient(90deg, #06b6d4 0%, #3b82f6 100%);
              color: #fff;
              border: none;
              border-radius: 10px;
              font-size: 1.1em;
              font-weight: 800;
              cursor: pointer;
              transition: all 0.22s cubic-bezier(.4,2,.6,1);
              box-shadow: 0 6px 24px rgba(6, 182, 212, 0.18);
              margin-top: 12px;
              text-transform: uppercase;
              letter-spacing: 1.2px;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 0.7em;
        }
        
        .btn-login:hover {
              transform: translateY(-2px) scale(1.03);
              box-shadow: 0 10px 32px rgba(59, 130, 246, 0.18);
              background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            font-size: 0.9em;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .register-link {
              text-align: center;
              margin-top: 28px;
              padding-top: 22px;
              border-top: 1.5px solid rgba(255, 255, 255, 0.13);
              color: rgba(255, 255, 255, 0.8);
              font-size: 1em;
        }
        
        .register-link a {
            color: #06b6d4;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .register-link a:hover {
            color: #22d3ee;
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .login-header h2 {
                font-size: 1.8em;
            }
            
            .login-content {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="emoji-icon">🎬</span>
            <h2>Sistema de Cartelera</h2>
        </div>
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
        <form method="POST" action="/auth/login" autocomplete="off">
            <div class="form-group" style="position:relative;">
                <label for="username">Usuario:</label>
                <svg style="position:absolute;left:14px;top:44px;width:20px;height:20px;fill:none;stroke:#06b6d4;stroke-width:2;z-index:2;pointer-events:none;opacity:0.85;" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
                <input type="text" id="username" name="username" 
                       value="{{ username if username else '' }}" 
                       placeholder="Ingresa tu usuario"
                       required autofocus>
            </div>
            <div class="form-group" style="position:relative;">
                <label for="password">Contraseña:</label>
                <svg style="position:absolute;left:14px;top:44px;width:20px;height:20px;fill:none;stroke:#06b6d4;stroke-width:2;z-index:2;pointer-events:none;opacity:0.85;" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="password" name="password" 
                       placeholder="Ingresa tu contraseña"
                       required>
            </div>
            <button type="submit" class="btn-login">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                Iniciar sesión
            </button>
        </form>
        <div class="register-link">
            ¿No tienes cuenta? <a href="/auth/registro">Regístrate aquí</a>
        </div>
    </div>
</body>
</html>
