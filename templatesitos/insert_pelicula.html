<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/images/iconn.png">
    <title>➕ Agregar Película</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('/static/images/backgroundregistro.jpeg') no-repeat center center fixed;
            background-size: cover;
            image-rendering: -webkit-optimize-contrast;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 0;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }
            50% { box-shadow: 0 0 35px rgba(6, 182, 212, 0.5); }
        }
        
        .form-container {
            max-width: 620px;
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), 0 0 40px rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.2);
            overflow: hidden;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #06b6d4, #a855f7, transparent);
            animation: shimmer 3s infinite linear;
        }
        
        .header {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.25), rgba(168, 85, 247, 0.15));
            color: white;
            padding: 40px 30px;
            text-align: center;
            border-bottom: 1px solid rgba(6, 182, 212, 0.15);
            position: relative;
            overflow: hidden;
        }
        
        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #06b6d4, #a855f7);
            border-radius: 3px;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #fff, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            opacity: 0.8;
            font-size: 1.05em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            color: rgba(255, 255, 255, 0.85);
        }
        
        .form-content {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 28px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 600;
            font-size: 1.05em;
            letter-spacing: 0.3px;
        }
        
        .form-group input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s ease;
            color: white;
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #06b6d4;
            background: rgba(6, 182, 212, 0.08);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15), 0 4px 20px rgba(6, 182, 212, 0.1);
            transform: translateY(-1px);
        }
        
        .form-group input:hover:not(:focus) {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 38px;
        }
        
        .btn {
            padding: 16px 32px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1.05em;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            letter-spacing: 0.3px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #0891b2, #a855f7);
            background-size: 200% 200%;
            color: white;
            flex: 1;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.35);
            animation: glow 3s infinite ease-in-out;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(6, 182, 212, 0.5);
            background-position: right center;
        }
        
        .btn-primary:active {
            transform: translateY(-1px) scale(0.98);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn-secondary:active {
            transform: translateY(-1px);
        }
        
        @media (max-width: 768px) {
            .form-content {
                padding: 25px;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">
            <h1>➕ Agregar Nueva Película</h1>
            <p>Administrador: {{ usuario.username }}</p>
        </div>
        
        <div class="form-content">
            <form action="/do_insertar_pelicula" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="titulo">🎬 Título:</label>
                    <input type="text" id="titulo" name="titulo" required placeholder="Ej: El Padrino">
                </div>
                
                <div class="form-group">
                    <label for="genero">🎭 Género:</label>
                    <input type="text" id="genero" name="genero" required placeholder="Ej: Drama, Acción, Comedia">
                </div>
                
                <div class="form-group">
                    <label for="año">📅 Año:</label>
                    <input type="number" id="año" name="año" required min="1900" max="2100" placeholder="Ej: 2024">
                </div>
                
                <div class="form-group">
                    <label for="director">🎥 Director:</label>
                    <input type="text" id="director" name="director" required placeholder="Ej: Francis Ford Coppola">
                </div>
                
                <div class="form-group">
                    <label for="imagen">🖼️ Imagen de la cartelera (opcional):</label>
                    <input type="file" id="imagen" name="imagen" accept="image/*">
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">✅ Guardar Película</button>
                    <a href="/peliculas" class="btn btn-secondary">❌ Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
